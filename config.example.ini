# wavelog-qsl-mailer configuration.
# Copy to config.ini. Only [qso] station_ids and since are required; an empty value
# means "take it from Wavelog". Relative paths are relative to this file.

[wavelog]
# Folder with Wavelog's config.php and database.php. Database login and QRZ.com/HamQTH
# credentials are read from there (the same ones Wavelog's "Update from Callbook" uses).
#   Docker (Wavelog config volume mounted read-only):  /wavelog-config
#   Linux install:                                     /var/www/html/application/config
config_dir = /wavelog-config

[qso]
# IDs of your Station Locations (Wavelog -> Station Setup -> Station Locations), comma separated.
# Leave empty and run once: the error message lists all Station Locations with their IDs.
station_ids =
# Send cards only for QSOs on or after this date (UTC), so your whole log history is not mailed.
since =
# QSOs younger than this wait for a later run (time to fix typos; bands worked together get one mail).
min_age_minutes = 30
# Callsigns and addresses that never get a card (e.g. someone asked you to stop).
skip_calls =
skip_emails =
# After sending, mark the QSO in Wavelog as QSL sent = Yes, via Electronic, with the date.
# Set false if you use the QSL sent fields for paper cards.
mark_qsl_sent = true

[card]
# Three ways to get a card, pick one:
#  1. Nothing set: a card is generated from your Station Location (callsign, operator, grid,
#     QTH, country, CQ/ITU zones). Choose the colours with theme = dusk | ocean | forest.
#  2. Your own photo: put background.jpg next to this file (or set background = path).
#     It is cropped to the card shape, darkened, and the same layout is drawn on top.
#  3. A finished card design: set image = path and box = x0,y0,x1,y1, the free area (in pixels)
#     where the QSO data goes. draw_box = true paints a white panel there.
#     printed_callsign / printed_grid: what the design shows; QSOs from another callsign
#     or grid (e.g. /P, a POTA park) get a "FROM ..." line in the box.
theme = dusk
background =
tagline = Tnx for QSO · 73!
image =
box = 845,705,1605,1005
draw_box = false
printed_callsign =
printed_grid =
jpeg_quality = 88

[mail]
# auto: Polish for SP/SQ/SO/SN/SR/3Z/HF, German for DL/DA–DR/OE/HB9, English for everyone else.
# Or force one: en, pl, de
language = auto
# Shown as links in the mail footer (plus your QRZ.com page unless qrz_link = false)
website =
qrz_link = true
# Empty = taken from Wavelog: sender from Admin -> Global Options -> Email,
# operator = first name of the Wavelog user, location = city · grid · country of the Station Location.
from =
operator =
location =
reply_to =
# Copy of every mail to yourself
bcc =
# HTML mail with the cards inline (false = plain text with the cards attached)
html = true
max_per_run = 20
delay_seconds = 5
# Custom subjects ({mycall}, {callsign}):
# subject_en = {mycall} – QSL card for our QSO, {callsign}

[callbook]
# Order of e-mail lookups. Empty credentials = from Wavelog's config.php.
# QRZ.com returns e-mail addresses only with an XML Logbook Data subscription; HamQTH is free.
order = qrz,hamqth
qrz_user =
qrz_password =
hamqth_user =
hamqth_password =
# Ask again after this many days for callsigns without an e-mail
retry_days = 30

[smtp]
# Empty = the SMTP server from Wavelog (Admin -> Global Options -> Email, protocol SMTP).
host =
port =
# starttls (587), ssl (465) or none
security =
user =
password =

[database]
# Empty = from Wavelog's database.php. Fill in only to override.
host =
port =
name =
user =
password =
# socket = /run/mysqld/mysqld.sock

[state]
# Which QSOs got a card, and callbook results
path = state.sqlite
