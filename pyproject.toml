[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wavelog-qsl-mailer"
dynamic = ["version"]
description = "QSL cards by e-mail for self-hosted Wavelog"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["PyMySQL>=0.9", "Pillow>=8.2"]

[project.optional-dependencies]
test = ["pytest", "aiosmtpd"]

[project.scripts]
qsl-mailer = "qsl_mailer.cli:main"

[project.urls]
Homepage = "https://github.com/gerlowski/wavelog-qsl-mailer"

[tool.setuptools]
packages = ["qsl_mailer"]

[tool.setuptools.dynamic]
version = {attr = "qsl_mailer.__version__"}

[tool.setuptools.package-data]
qsl_mailer = ["assets/*"]
